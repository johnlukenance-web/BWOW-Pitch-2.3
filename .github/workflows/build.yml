name: Build Bwow Pitch 2 (Windows x64 VST3)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build DSP test driver and plug-in
        run: cmake --build build --config Release --parallel

      - name: DSP functional tests (real core code)
        run: |
          python -m pip install numpy scipy
          python tests/run_tests.py

      - name: pluginval (host-compatibility validation)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip pv
          ./pv/pluginval.exe --strictness-level 5 --validate-in-process "build/BwowPitch2_artefacts/Release/VST3/Bwow Pitch 2.vst3"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse "build/BwowPitch2_artefacts/Release/VST3/Bwow Pitch 2.vst3" dist/
          Copy-Item INSTALL.txt dist/
          Compress-Archive -Path dist/* -DestinationPath BwowPitch2_VST3_win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BwowPitch2_VST3_win64
          path: BwowPitch2_VST3_win64.zip
